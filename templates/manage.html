<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="IamBusy — Manage your weekly schedule. Add, edit, move, and delete activities.">
    <title>IamBusy — Manage Schedule</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
</head>

<body>
    <div class="manage-container" role="main">

        <!-- ── Header ──────────────────────────────────── -->
        <header class="manage-header">
            <div class="manage-header-top">
                <a href="/" class="back-link" id="back-link" aria-label="Back to schedule">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </a>
                <h1 class="manage-title">Manage Schedule</h1>
                <button class="btn-add" id="btn-add" aria-label="Add new activity">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>

            <!-- Week type tabs -->
            <div class="week-tabs" id="week-tabs" role="tablist">
                <button class="week-tab active" data-week="odd" role="tab" aria-selected="true">Odd Week</button>
                <button class="week-tab" data-week="even" role="tab" aria-selected="false">Even Week</button>
            </div>
        </header>

        <!-- ── Weekly Grid ─────────────────────────────── -->
        <div class="grid-wrapper" id="grid-wrapper">
            <div class="manage-grid" id="manage-grid">
                <!-- Rendered by JS -->
            </div>
        </div>

    </div>

    <!-- ══════════════ Add / Edit Modal ══════════════ -->
    <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Add Activity</h2>
                <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
            </div>
            <form class="modal-body" id="activity-form" autocomplete="off">
                <input type="hidden" id="form-id" value="">

                <div class="form-group">
                    <label class="form-label" for="form-title">Activity Name</label>
                    <input class="form-input" type="text" id="form-title" placeholder="e.g. Calculus II (S) | AN204"
                        required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="form-day">Day</label>
                        <select class="form-select" id="form-day" required>
                            {% for d in days %}
                            <option value="{{ d }}">{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="form-week-type">Week</label>
                        <select class="form-select" id="form-week-type" required>
                            <option value="both">Both</option>
                            <option value="odd">Odd</option>
                            <option value="even">Even</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="form-start">Start Time</label>
                        <input class="form-input" type="time" id="form-start" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="form-end">End Time</label>
                        <input class="form-input" type="time" id="form-end" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ══════════════ Conflict Modal ══════════════ -->
    <div class="modal-overlay" id="conflict-overlay" aria-hidden="true">
        <div class="modal modal-conflict" role="alertdialog" aria-labelledby="conflict-title">
            <div class="modal-header modal-header-warning">
                <h2 class="modal-title" id="conflict-title">
                    <span class="warning-icon">⚠️</span> Schedule Conflict
                </h2>
                <button class="modal-close" id="conflict-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="conflict-message">The selected time slot overlaps with:</p>
                <div class="conflict-list" id="conflict-list">
                    <!-- Rendered by JS -->
                </div>
                <div class="conflict-actions">
                    <button class="btn btn-danger" id="conflict-delete">
                        Delete conflicting & save
                    </button>
                    <button class="btn btn-ghost" id="conflict-choose-another">
                        Choose another time
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════════ Delete Confirm Modal ══════════════ -->
    <div class="modal-overlay" id="delete-overlay" aria-hidden="true">
        <div class="modal modal-delete" role="alertdialog" aria-labelledby="delete-title">
            <div class="modal-header modal-header-danger">
                <h2 class="modal-title" id="delete-title">
                    <span class="warning-icon">🗑️</span> Delete Activity
                </h2>
            </div>
            <div class="modal-body">
                <p class="delete-message" id="delete-message">Are you sure you want to delete this activity?</p>
                <div class="form-actions">
                    <button class="btn btn-ghost" id="delete-cancel">Cancel</button>
                    <button class="btn btn-danger" id="delete-confirm">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/manage.js"></script>
</body>

</html>
