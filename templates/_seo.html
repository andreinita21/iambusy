{# Link-preview cards (WhatsApp, Messenger, Discord, X, …).  Import with
   {% from "_seo.html" import social_meta with context %}. #}
{% macro social_meta(title, description, path=None, image="/static/icons/og-image.png") %}
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ro_RO">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ site.url }}{{ path if path is not none else request.path }}">
    <meta property="og:image" content="{{ site.url }}{{ image }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="IamBusy — orarul tău în timp real">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ image }}">
{% endmacro %}
