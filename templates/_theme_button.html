{# Signed in: the palette opens the theme page.  Visitors: the light / dark switch. #}
{% if g.user %}
<a href="/account/theme" class="btn btn-icon" id="theme-link" aria-label="Temă și culori" title="Temă și culori">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"></path>
        <circle cx="7.5" cy="11.5" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="10" cy="7.3" r="1.3" fill="currentColor" stroke="none"></circle>
        <circle cx="14.8" cy="7.3" r="1.3" fill="currentColor" stroke="none"></circle>
    </svg>
</a>
{% else %}
<button type="button" class="btn btn-icon theme-toggle" id="theme-toggle" aria-label="Schimbă tema"
    title="Temă luminoasă / întunecată">
    <svg class="ico-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
    </svg>
    <svg class="ico-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </svg>
</button>
{% endif %}
